stages:

  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/dataset.csv
    outs:
      - data/processed/processed.csv

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/processed.csv
    params:
      - train
      - model
    outs:
      - models/model.pkl

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.pkl
    metrics:
      - metrics/metrics.json